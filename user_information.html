<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width", initial-scale="1.0">

<title>Adoption Form</title>

</head>

<body>
     <section id="user-form">
     <h1>Adoption Form</h1>

     <form id="application-form">
       <label for="name">Enter your name:</label>
       <input
         id="name"
         name="name"
         type="text"
         required
       >
     
       <label for="email">Enter your email:</label>
       <input
         id="email"
         name="email"    
         type="email"
         required
       >
      
       <label for="phone">Enter your phone number:</label>
       <input
         id="phone"
         name="phone"
         type="tel"
         required
       >

       <label for="Address">Enter your residence address:</label>
       <input
         id="address"
         name="address"
         type="address"
         required
        >
        

       <button type="submit">Submit Adoption Form</button>
     </form> 

     <button id="payment-button" type=button hidden>
          Payment
     </button> 
   </section>

   <script src="../User_Data/submit_form.js"></script>
</body>       
</html>
