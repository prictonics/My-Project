<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>General Adoption Permit Questionnaire</title>
</head>


<body>
  <section id="Adoption-questionnaire">
    <h1>General adoption Permit Questionnaire</h1>


    <form id="permit-questionnaire">
       <label for="General-Health">Do you have any diseases/allergies/health problems? If yes, which diseases/allergies/health problems?</label>
       <textarea
       id="General-Health"
       name="General-Health"
       rows="5"
       required
       ></textarea>


      <p>
        <label for="Mental-Health">Do you have any mental health issues diagnosis? If yes, what/which diagnoses?</label>
        <textarea
        id="Mental-Health"
        name="Mental-Health"
        rows="5"
        required
        ></textarea>
      </p>


      <p>
        <label for="reason">What makes you want to adopt Scarlet?</label>
        <textarea
        id="reason"
        name="reason"
        rows="5"
        required
        ></textarea>
      </p>


    <button type="submit">Submit Questionnaire</button>
  </form>

  <p id="form-message"></p>
  
</section>

<script src="../Questionnaire-script/script.js"></script>

</body>
</html>
